# Publishes a new agentparley release to https://get.agentparley.ai — triggered by a git tag, never by a
# push to main, so shipping a new binary to every customer's box on its next start is a deliberate act rather than
# something that follows from a plain commit.
#
#   git tag tunnel-v1.4.2 && git push origin tunnel-v1.4.2
#
# Upload order is the correctness mechanism: every versioned artifact and the install scripts land BEFORE
# latest-version does, so a box reading the pointer mid-publish can only ever see the old, complete release or the
# new, complete one — never a dangling reference to a release that isn't fully uploaded yet.
#
# AWS access is GitHub OIDC into the agentparley-tunnel-release role (AgentParley's infrastructure/aws/global.yaml),
# which trusts only tunnel-v* tags of this repo — there is no stored key.
#
# This is the PUBLIC daemon repo. The wire contract in proto/tunnel.proto is mirrored from the server monorepo,
# which owns it; the monorepo's own pipeline fails if the two ever drift (it reads this repo's proto over HTTPS).
name: release

on:
  push:
    tags: ["tunnel-v*"]

permissions:
  id-token: write
  contents: read

env:
  BUCKET: get.agentparley.ai

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: build
        run: |
          VERSION="${GITHUB_REF_NAME#tunnel-v}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "tag ${GITHUB_REF_NAME} does not have the shape tunnel-v<semver> (got version: $VERSION)"
            exit 1
          }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # All dependencies (grpc, protobuf, yaml.v3) are pure Go — CGO off is safe and makes the binaries static.
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/agentparley/tunnel/internal/version.Version=$VERSION" \
              -o "dist/agentparley-linux-$arch" .
          done
          # Sidecar checksums install.sh and the daemon's update both verify the download against. Written from
          # inside dist/ so each line carries the bare filename, which is what `sha256sum -c` expects.
          cd dist && for f in agentparley-linux-amd64 agentparley-linux-arm64; do sha256sum "$f" > "$f.sha256"; done && cd ..
          echo "$VERSION" > dist/latest-version

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::990851549648:role/agentparley-tunnel-release
          aws-region: eu-central-1

      - name: publish
        run: |
          # Versions are write-once: releases/<v>/ is served immutable and cached for a year, so overwriting it after
          # Cloudflare has cached the old bytes leaves the fleet split on two binaries for the same version string. A
          # re-cut release needs a new version number, not a re-push of this tag.
          if [ -n "$(aws s3 ls "s3://$BUCKET/releases/$VERSION/")" ]; then
            echo "s3://$BUCKET/releases/$VERSION/ already exists — versions are write-once, bump the version and re-tag"
            exit 1
          fi
          aws s3 cp dist/ "s3://$BUCKET/releases/$VERSION/" --recursive --exclude "*" --include "agentparley-linux-*" \
            --cache-control "public, max-age=31536000, immutable"
          for script in install.sh uninstall.sh; do
            aws s3 cp "packaging/linux/$script" "s3://$BUCKET/tunnel/$script" \
              --cache-control "public, max-age=300" --content-type "text/x-shellscript"
          done
          # The pointer, LAST — only once every binary it can point at is fully uploaded.
          aws s3 cp dist/latest-version "s3://$BUCKET/latest-version" --cache-control "public, max-age=300" --content-type "text/plain"
