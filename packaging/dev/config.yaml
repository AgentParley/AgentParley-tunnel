# Dev-only config for docker-compose.dev.yml's tunnel-test-host container — talks to the host machine's PlatformApi
# (dotnet run, :5080) and the ssh-egress compose service on the shared docker network.
server:
  api: http://host.docker.internal:5080
  egress: localhost:8080   # tunnel-test-host shares ssh-egress's network namespace (see docker-compose.dev.yml) —
                            # "localhost" here really is the ssh-egress container, which is what lets `start
                            # -insecure` stay literal-localhost-only per internal/client/dial.go.
run_as: root
read_only: false
allow_commands: []   # matched against the RAW command text; "*" crosses "/" — see README's Configuration section
deny_commands: []
enabled: true

# Local model harnesses: THE way to expose them is `agentparley register` (no argument) — it scans codex,
# claude, ollama, and openai-compatible-local. codex and claude run as the daemon's own pinned copies with a login
# of their own (`register codex` / `register claude` sign them in); a local server is found on a well-known port.
# What it finds is persisted to /var/lib/agentparley/harnesses.json — no config.yaml edit, no restart.
# `register <harness>` / `unregister <harness>` work on just one. Everything below is OPTIONAL — set only to size
# the CLI harnesses' warm sessions, or to supply what `register` can't find (a bespoke server's URL, a model's
# context window). The CLI harnesses never take a command or any flag from config.
# harnesses:
#   codex:
#     max_warm_sessions: 32          # chats kept warm at once (default 32)
#     warm_idle_minutes: 30          # a warm chat idle this long is closed (default 30)
#   claude:
#     max_warm_sessions: 8           # each warm Claude Code chat is a ~300 MB process (default 8)
#   ollama:
#     url: http://localhost:11434    # this is the default; only needed to override
#   openai-compatible-local:
#     url: http://localhost:8000    # overrides discovery — `register` also tries LM Studio (:1234), vLLM
#                                   # (:8000), and llama.cpp (:8080) on its own. Give the SERVER root, not the
#                                   # /v1 base an OpenAI client takes; a trailing /v1 is trimmed for you since
#                                   # that is what everyone pastes.
#     models:
#       - id: my-local-model
#         label: My local model
#         context_window_tokens: 32768   # required whenever the server doesn't expose max_model_len
# allow_harnesses: []   # empty = all four harnesses considered (subject to detection succeeding on the box)
# deny_harnesses: []    # e.g. ["codex"] to keep the codex harness off even if installed
